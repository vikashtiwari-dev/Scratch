<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <nav class="nav-menu" aria-label="Quick links">
      <a href="">Gmail</a>
      <a href="">Images</a>
      <button type="button" class="apps-btn" aria-label="Google apps">
        <img src="assets/apps.svg" alt="Apps menu" width="20" height="20">
      </button>
      <button type="button" class="sign-in-btn">Sign in</button>
    </nav>
  </header>

  <main>
    <div class="search-container">
      <img src="assets/google.logo.svg" alt="Google" class="logo" width="120" height="120">

      <form class="search-form" action="#" method="get" role="search">
        <div class="search-input-wrapper">
          <img src="assets/search.svg" alt="Search icon" class="search-icon" width="18" height="18">

          <label for="search-box" class="sr-only">Search Google</label>
          <input type="search" id="search-box" name="q" autocomplete="off" spellcheck="false" placeholder="">

          <button type="button" class="mic-btn" aria-label="Search by voice">
            <img src="assets/mic.svg" alt="Voice search" width="16" height="16">
          </button>
        </div>

        <div class="buttons-row">
          <button type="submit" class="btn">Google Search</button>
          <button type="button" class="btn">I'm Feeling Lucky</button>
        </div>
      </form>

      <div class="languages">
        <p>Google offered in:
          <a href="">हिन्दी</a>
          <a href="">বাংলা</a>
          <a href="">తెలుగు</a>
          <a href="">मराठी</a>
          <a href="">தமிழ்</a>
          <a href="">ગુજરાતી</a>
        </p>
      </div>
    </div>
  </main>

  <footer>
    <div class="location">India</div>
    <div class="footer-links">
      <div class="links-left">
        <a href="">About</a>
        <a href="">Advertising</a>
        <a href="">Business</a>
        <a href="">How Search works</a>
      </div>
      <div class="links-right">
        <a href="">Privacy</a>
        <a href="">Terms</a>
        <a href="">Settings</a>
      </div>
    </div>
  </footer>

</body>

</html>
